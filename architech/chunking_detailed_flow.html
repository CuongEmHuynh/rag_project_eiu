<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAHC-v2 Horizontal Chunking Flow</title>
  <style>
    :root {
      --paper: #ffffff;
      --ink: #000000;
      --panel: #ededed;
      --rule: #b8bcc4;
      --muted: #5f6673;
      --accent: #3d8dff;
      --green: #00a240;
      --font-sans: "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
    }

    main {
      width: min(1560px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 40px 0 56px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(32px, 4vw, 48px);
      line-height: 1.04;
      font-weight: 700;
      letter-spacing: 0;
    }

    .figure-shell {
      overflow-x: auto;
      border: 1px solid rgba(184, 188, 196, 0.72);
      border-radius: 8px;
      background: #fbfbfb;
    }

    svg {
      display: block;
      min-width: 3680px;
      width: 100%;
      height: auto;
    }
  </style>
</head>
